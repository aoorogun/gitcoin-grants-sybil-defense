[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gitcoin-grants-sybil-defense"
version = "1.0.0"
description = "Quadratic-funding Sybil defense and allocation analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "joblib>=1.3,<2", "numpy>=1.26,<3", "pandas>=2.1,<4", "pydantic>=2.6,<3", "PyYAML>=6,<7", "scikit-learn>=1.4,<2", "uvicorn>=0.27,<1"]
[project.optional-dependencies]
deep-learning = ["torch>=2.2,<3"]
dev = ["httpx>=0.27,<1", "ruff>=0.4,<1"]
[project.scripts]
gitcoin-integrity = "gitcoin_integrity.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

